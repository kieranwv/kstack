name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: git fetch --no-tags origin "${BASE_REF}"

      - name: Tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Skill layout, evals, and rule numbers
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python3 scripts/check_skills.py --base "origin/${BASE_REF}"

      - name: Generated rules document
        run: python3 scripts/generate_rules_doc.py --check

      - name: Public content
        run: python3 scripts/check_public_content.py

      - name: Fetch pstack main
        run: |
          git clone --depth 1 --branch main --filter=blob:none --sparse \
            https://github.com/cursor/plugins.git "$RUNNER_TEMP/cursor-plugins"
          git -C "$RUNNER_TEMP/cursor-plugins" sparse-checkout set pstack

      - name: pstack extends targets
        run: python3 scripts/check_refs.py --pstack "$RUNNER_TEMP/cursor-plugins/pstack"

      - name: Eval hashes
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python3 scripts/eval_hash.py check --base "origin/${BASE_REF}"

      - name: markdownlint
        run: npx --yes markdownlint-cli@0.44.0 "**/*.md"

      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose
