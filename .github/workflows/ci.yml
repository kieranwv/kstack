name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: git fetch --no-tags origin "${BASE_REF}"

      - name: Rule number tests
        run: python3 scripts/test_rules.py

      - name: Skill layout, evals, and rule numbers
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python3 scripts/check_skills.py --base "origin/${BASE_REF}"

      - name: Generated rules document
        run: python3 scripts/generate_rules_doc.py --check

      - name: markdownlint
        run: npx --yes markdownlint-cli@0.44.0 "**/*.md"

      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose
